services:
  - type: web
    runtime: node
    name: deposit-studio-api
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm run start -w @deposit-studio/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: WEB_ORIGIN
        value: https://deposit-studio-web.onrender.com
  - type: web
    runtime: static
    name: deposit-studio-web
    buildCommand: npm ci && npm run build -w @deposit-studio/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_HOST
        value: deposit-studio-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
