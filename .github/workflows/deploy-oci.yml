name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oci-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_WEB_HOST: ${{ secrets.OCI_WEB_HOST }}
      OCI_WAS_HOST: ${{ secrets.OCI_WAS_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build frontend
        env:
          VITE_API_URL: https://n9signal.duckdns.org
        run: npm run build
      - name: Package releases
        run: |
          tar --exclude=.git --exclude=.github --exclude=node_modules --exclude=data --exclude=apps/web/dist -czf /tmp/deposit-studio-api-${GITHUB_SHA}.tar.gz .
          tar -C apps/web -czf /tmp/deposit-studio-web-${GITHUB_SHA}.tar.gz dist
      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          test -n "$OCI_WEB_HOST" && test -n "$OCI_WAS_HOST"
          test -n "$OCI_SSH_PRIVATE_KEY" && test -n "$OCI_KNOWN_HOSTS"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oci_deploy ~/.ssh/known_hosts
      - name: Deploy frontend to web server
        run: |
          user="${OCI_USER:-opc}"
          for attempt in {1..60}; do
            if ssh -o ConnectTimeout=5 -i ~/.ssh/oci_deploy "${user}@${OCI_WEB_HOST}" true; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 5
          done
          scp -i ~/.ssh/oci_deploy /tmp/deposit-studio-web-${GITHUB_SHA}.tar.gz deploy/oci/deploy-web.sh "${user}@${OCI_WEB_HOST}:/tmp/"
          ssh -i ~/.ssh/oci_deploy "${user}@${OCI_WEB_HOST}" "sudo RELEASE_ID='${GITHUB_SHA}' bash /tmp/deploy-web.sh"
      - name: Deploy API to WAS
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          user="${OCI_USER:-opc}"
          test -n "$ELEVENLABS_API_KEY"
          umask 077
          printf 'ELEVENLABS_API_KEY=%s\n' "$ELEVENLABS_API_KEY" > /tmp/deposit-studio-api.env
          scp -i ~/.ssh/oci_deploy /tmp/deposit-studio-api-${GITHUB_SHA}.tar.gz deploy/oci/deploy-was.sh /tmp/deposit-studio-api.env "${user}@${OCI_WAS_HOST}:/tmp/"
          ssh -i ~/.ssh/oci_deploy "${user}@${OCI_WAS_HOST}" "sudo RELEASE_ID='${GITHUB_SHA}' WEB_ORIGIN='https://n9signal.duckdns.org' bash /tmp/deploy-was.sh"
      - name: Verify public endpoints
        run: |
          curl -fsS --retry 10 --retry-delay 3 "https://n9signal.duckdns.org/api/health"
          curl -fsS --retry 10 --retry-delay 3 "https://n9signal.duckdns.org/" >/dev/null
